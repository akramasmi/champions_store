<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="robots" content="noindex, nofollow">
    <title>لوحة الإدارة</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>🔐 لوحة الإدارة</h2>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
            <button onclick="checkPassword()">دخول</button>
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel" style="display:none;">
        <header class="admin-header">
            <h1>⚙️ لوحة إدارة Champions Store</h1>
            <div class="header-actions">
                <button class="btn-publish" onclick="publishDirectly()">🚀 نشر فوري على الموقع</button>
                <button class="btn-logout" onclick="logout()">🚪 خروج</button>
            </div>
        </header>

        <nav class="admin-tabs">
            <button class="tab-btn active" data-tab="products">📦 المنتجات</button>
            <button class="tab-btn" data-tab="categories">🏷️ الفئات</button>
            <button class="tab-btn" data-tab="store">🏪 معلومات المتجر</button>
            <button class="tab-btn" data-tab="logo">🖼️ اللوغو</button>
            <button class="tab-btn" data-tab="github">🐙 إعدادات GitHub</button>
        </nav>

        <main class="admin-content">
            <!-- تبويب المنتجات -->
            <section class="tab-content active" id="productsTab">
                <div class="section-header">
                    <h2>إدارة المنتجات</h2>
                    <button class="btn-add" onclick="openProductModal()">➕ إضافة منتج</button>
                </div>
                <div class="products-table" id="productsTable"></div>
            </section>

            <!-- تبويب الفئات (جديد) -->
            <section class="tab-content" id="categoriesTab">
                <h2>إدارة الفئات</h2>
                <div class="github-form">
                    <div class="form-row">
                        <div class="form-group"><label>اسم الفئة</label><input type="text" id="newCatName" placeholder="مثال: بروتين"></div>
                        <div class="form-group"><label>أيقونة (Emoji)</label><input type="text" id="newCatIcon" placeholder="مثال: 🥛"></div>
                    </div>
                    <button class="btn-save" onclick="addCategory()">➕ إضافة فئة</button>
                    <div id="categoriesList" style="margin-top: 20px;"></div>
                </div>
            </section>

            <!-- تبويب معلومات المتجر -->
            <section class="tab-content" id="storeTab">
                <h2>معلومات المتجر</h2>
                <div class="github-form">
                    <div class="form-group"><label>اسم المتجر</label><input type="text" id="storeName"></div>
                    <div class="form-group"><label>رقم واتساب (مع رمز الدولة)</label><input type="text" id="storeWhatsapp" placeholder="963900000000"></div>
                    <div class="form-group"><label>العنوان</label><input type="text" id="storeLocation" placeholder="دمشق - سوريا"></div>
                    <button class="btn-save" onclick="saveStoreInfo()">💾 حفظ التغييرات</button>
                </div>
            </section>

            <!-- تبويب اللوغو -->
            <section class="tab-content" id="logoTab">
                <h2>إدارة اللوغو</h2>
                <div class="github-form">
                    <div class="logo-preview"><img id="logoPreview" src="logo.png" alt="اللوغو"></div>
                    <div class="form-group"><label>رابط اللوغو الجديد</label><input type="text" id="logoUrl" placeholder="https://..."></div>
                    <button class="btn-save" onclick="saveLogo()">💾 حفظ اللوغو</button>
                </div>
            </section>

            <!-- تبويب GitHub -->
            <section class="tab-content" id="githubTab">
                <h2>إعدادات GitHub للنشر الفوري</h2>
                <div class="github-form">
                    <div class="form-group"><label>GitHub Username</label><input type="text" id="githubUsername"></div>
                    <div class="form-group"><label>Repository Name</label><input type="text" id="githubRepo"></div>
                    <div class="form-group"><label>Personal Access Token</label><input type="password" id="githubToken"></div>
                    <button class="btn-save" onclick="saveGitHubConfig()">💾 حفظ الإعدادات</button>
                </div>
            </section>
        </main>
    </div>

    <!-- مودال المنتج (مختصر) -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modalTitle">منتج</h3><button class="close-btn" onclick="closeProductModal()">✕</button></div>
            <div class="modal-body">
                <input type="hidden" id="productId">
                <div class="form-group"><label>الاسم</label><input type="text" id="productName"></div>
                <div class="form-group"><label>الفئة</label><select id="productCategory"></select></div>
                <div class="form-row">
                    <div class="form-group"><label>السعر</label><input type="number" id="productPrice" step="0.01"></div>
                    <div class="form-group"><label>السعر القديم</label><input type="number" id="productOldPrice" step="0.01"></div>
                </div>
                <div class="form-group"><label>رابط الصورة</label><input type="text" id="productImageUrl"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeProductModal()">إلغاء</button>
                <button class="btn-save" onclick="saveProduct()">💾 حفظ</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="admin-script.js"></script>
</body>
</html>
